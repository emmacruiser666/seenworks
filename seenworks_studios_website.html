<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>seenworks studios</title>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0a0a;
    --text:#f5f5f5;
    --muted:#9a9a9a;
    --line:#1f1f1f;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Open Sans', sans-serif;
  }

  body{
    background:var(--bg);
    color:var(--text);
    letter-spacing:0.3px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 40px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    text-transform:lowercase;
    font-size:12px;
    letter-spacing:2px;
    font-weight:500;
  }

  .brand img{
    width:34px;
    height:34px;
    object-fit:contain;
  }

  .nav-right a{
    font-size:11px;
    color:var(--muted);
    text-decoration:none;
    letter-spacing:2px;
    text-transform:lowercase;
  }

  .nav-right a:hover{
    color:var(--text);
  }

  section{
    padding:60px 40px;
    border-top:1px solid var(--line);
  }

  .label{
    font-size:11px;
    color:var(--muted);
    letter-spacing:2px;
    text-transform:lowercase;
    margin-bottom:24px;
  }

  .video-wrap iframe{
    width:100%;
    height:520px;
    border:none;
    margin-top:10px;
  }

  footer{
    padding:60px 40px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--muted);
    text-transform:lowercase;
    letter-spacing:2px;
  }

  footer a{
    color:var(--muted);
    text-decoration:none;
  }

  footer a:hover{
    color:var(--text);
  }

</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="https://seenworks.us.to/home/_assets/media/42af61079552d5b1ce94ea666b5a7ea9.png" />
    seenworks studios
  </div>

  <div class="nav-right">
    <a href="https://www.youtube.com/@seenworks" target="_blank">youtube</a>
  </div>
</header>

<section id="latest">
  <div class="label">latest video</div>
  <div class="video-wrap">
    <iframe src="https://www.youtube.com/embed/epdS-kEC414" allowfullscreen></iframe>
  </div>
</section>

<section id="films">
  <div class="label">upcoming films</div>
</section>

<footer>
  <div>© seenworks studios</div>
  <div><a href="https://www.youtube.com/@seenworks" target="_blank">yt</a></div>
</footer>

</body>
</html>
